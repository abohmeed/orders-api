name: agent-review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to approve as github-actions[bot]
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt PR approval as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Attempting: gh pr review ${PR} --approve (GITHUB_TOKEN)"
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve
