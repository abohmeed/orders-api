# DSAI-12 starts with the bad default on purpose (write-all).
# On camera: replace with contents:read, pull-requests:write, id-token:write.
name: agent-fix

on:
  pull_request:

permissions: write-all

jobs:
  agent-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: dsai-agent-fix

      - name: Prove push to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Attempting push to main with job token (expected denial when permissions are least-privilege)..."
          git config user.name "dsai-agent-bot"
          git config user.email "dsai-agent-bot@users.noreply.github.com"
          git checkout -B main
          echo "agent-touch $(date -u +%Y%m%dT%H%M%SZ)" >> .agent-touch
          git add .agent-touch
          git commit -m "agent: direct push to main (should be denied)" || true
          git push origin HEAD:main
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED: push to main succeeded"
            exit 1
          fi
          echo "PASS: push to main denied (exit $rc)"
          # Leave a PR comment suggestion instead of merging
          gh pr comment "${{ github.event.pull_request.number }}" --body "Agent fix suggestion only — human must accept. Direct push to main was denied."
