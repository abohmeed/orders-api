name: agent-fix
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  agent-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove push to main is denied
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "dsai-agent-bot"
          git config user.email "dsai-agent-bot@users.noreply.github.com"
          echo "agent-touch $(date -u +%Y%m%dT%H%M%SZ)" >> .agent-touch
          git add .agent-touch
          git commit -m "agent: direct push to main (should be denied)"
          git push origin HEAD:main
          rc=$?
          set -e
          echo "push_exit=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "UNEXPECTED: push to main succeeded"
            exit 1
          fi
          echo "PASS: push to main denied"
